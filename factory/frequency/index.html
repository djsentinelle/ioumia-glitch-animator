<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>frequency animator · ioumia</title>
<link rel="icon" type="image/png" href="/site/avatar.png">
</head>
<body>

<header>
  <a class="tool-brand" href="/factory/">
    <span class="nav-logo"><img src="/site/avatar.png" alt="ioumia"></span>
    <span class="tool-name">
      <span class="tool-crumbs">ioumia ˚₊· the factory</span>
      <span class="tool-title">frequency animator</span>
    </span>
  </a>
  <nav class="page-nav" aria-label="tools">
    <a href="/factory/">← all tools</a>
    <a href="/factory/glitch/">glitch animator</a>
    <a href="/factory/frequency/" class="active" aria-current="page">frequency animator</a>
  </nav>
</header>

<div class="main">
  <div class="render-pane" id="renderPane">
    <div class="freq-stage" id="freqStage">
      <div class="freq-hint" id="freqHint">
        <img class="drop-icon" src="/assets/kiki-drop.png" alt="" width="268" height="360">
        <div class="drop-text">Drop a background and an audio file</div>
        <div class="drop-text is-hint">PNG · MP3 · WAV · OGG</div>
      </div>
      <canvas id="freqCanvas" hidden></canvas>
    </div>
  </div>

  <div class="settings-pane" id="settingsPane">
    <div class="controls" id="controls">
      <div class="file-field">
        <div class="section-title">BACKGROUND <span class="section-hint">png</span></div>
        <button type="button" class="file-slot" id="bgSlot">Tap or drop a PNG</button>
        <input type="file" id="bgInput" accept="image/png,.png" hidden>
        <div class="file-error" id="bgError" role="alert"></div>
      </div>

      <div class="file-field">
        <div class="section-title">AUDIO</div>
        <button type="button" class="file-slot" id="audioSlot">Tap or drop an audio file</button>
        <input type="file" id="audioInput" accept="audio/*" hidden>
        <div class="file-error" id="audioError" role="alert"></div>
        <audio id="audioPlayer" controls hidden></audio>
      </div>

      <div class="slider-group">
        <div class="section-title">FREQUENCIES <span id="rangeLabel"></span></div>
        <div class="range-dual" id="rangeDual">
          <div class="range-fill"></div>
          <input type="range" id="rangeMinSlider" min="0" max="1000" value="0" aria-label="Lowest frequency">
          <input type="range" id="rangeMaxSlider" min="0" max="1000" value="1000" aria-label="Highest frequency">
        </div>
        <button type="button" class="btn" id="autoRangeBtn">↺ Auto range</button>
        <div class="ctrl-row">
          <button type="button" class="btn" id="axisXBtn">↔ Width</button>
          <button type="button" class="btn" id="axisYBtn">↕ Height</button>
        </div>
        <button type="button" class="btn" id="invertBtn">⇄ Invert</button>
        <div class="freq-note" id="directionLabel"></div>
        <div class="slider-row"><span class="slider-label">Bands</span><input type="range" id="bandsSlider" min="8" max="128" value="48"><span class="slider-val" id="bandsVal">48</span></div>
      </div>

      <div class="slider-group">
        <div class="section-title">BAND EFFECTS</div>
        <div class="slider-row"><span class="slider-label">Blur</span><input type="range" id="blurSlider" min="0" max="10" step="0.5" value="4"><span class="slider-val" id="blurVal">4</span></div>
        <div class="slider-row"><span class="slider-label">Noise</span><input type="range" id="noiseSlider" min="0" max="10" step="0.5" value="3"><span class="slider-val" id="noiseVal">3</span></div>
        <div class="slider-row"><span class="slider-label">Glitch</span><input type="range" id="glitchSlider" min="0" max="10" step="0.5" value="4"><span class="slider-val" id="glitchVal">4</span></div>
        <div class="slider-row"><span class="slider-label">Aberration</span><input type="range" id="aberrationSlider" min="0" max="10" step="0.5" value="2"><span class="slider-val" id="aberrationVal">2</span></div>
        <div class="slider-row"><span class="slider-label">Hue</span><input type="range" id="hueSlider" min="0" max="360" step="1" value="0"><span class="slider-val" id="hueVal">0</span></div>
        <div class="slider-row"><span class="slider-label">Bloom</span><input type="range" id="bloomSlider" min="0" max="10" step="0.5" value="0"><span class="slider-val" id="bloomVal">0</span></div>
      </div>

      <div class="slider-group">
        <div class="section-title">EXPORT <span class="section-hint">full resolution</span></div>
        <button type="button" class="btn record" id="exportBtn">⏺ Export MP4</button>
        <button type="button" class="btn download" id="downloadBtn" hidden>⬇ Download MP4</button>
        <div class="freq-note" id="exportStatus" role="status"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/frequency/main.ts"></script>
</body>
</html>
