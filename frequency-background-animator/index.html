<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ioumia frequency background animator</title>
<link rel="icon" type="image/svg+xml" href="/assets/kiki-favicon.svg">
</head>
<body>

<header>
  <img class="nav-logo" src="/assets/kiki.png" alt="kiki">
  <div class="header-text">
    <div class="logo">ioumia<span>~</span>frequency background animator</div>
    <nav class="page-nav">
      <a href="/">glitch generator</a>
      <a href="/frequency-background-animator/" class="active" aria-current="page">frequency background</a>
    </nav>
  </div>
</header>

<div class="main">
  <div class="render-pane" id="renderPane">
    <div class="freq-stage" id="freqStage">
      <div class="freq-hint" id="freqHint">
        <div class="drop-icon">⬡</div>
        <div class="drop-text">Drop a background and an audio file</div>
        <div class="drop-text" style="opacity:0.4; font-size:9px;">PNG · MP3 · WAV · OGG</div>
      </div>
      <canvas id="freqCanvas" hidden></canvas>
    </div>
  </div>

  <div class="settings-pane" id="settingsPane">
    <div class="controls" id="controls">
      <div class="file-field">
        <div class="section-title">BACKGROUND <span style="opacity:0.35;font-size:8px">png</span></div>
        <button type="button" class="file-slot" id="bgSlot">Tap or drop a PNG</button>
        <input type="file" id="bgInput" accept="image/png,.png" hidden>
        <div class="file-error" id="bgError" role="alert"></div>
      </div>

      <div class="file-field">
        <div class="section-title">AUDIO</div>
        <button type="button" class="file-slot" id="audioSlot">Tap or drop an audio file</button>
        <input type="file" id="audioInput" accept="audio/*" hidden>
        <div class="file-error" id="audioError" role="alert"></div>
        <audio id="audioPlayer" controls hidden></audio>
      </div>

      <div class="slider-group">
        <div class="section-title">FREQUENCIES <span id="rangeLabel"></span></div>
        <div class="range-dual" id="rangeDual">
          <div class="range-fill"></div>
          <input type="range" id="rangeMinSlider" min="0" max="1000" value="0" aria-label="Lowest frequency">
          <input type="range" id="rangeMaxSlider" min="0" max="1000" value="1000" aria-label="Highest frequency">
        </div>
        <button type="button" class="btn" id="autoRangeBtn">↺ Auto range</button>
        <div class="ctrl-row">
          <button type="button" class="btn" id="axisXBtn">↔ Width</button>
          <button type="button" class="btn" id="axisYBtn">↕ Height</button>
        </div>
        <button type="button" class="btn" id="invertBtn">⇄ Invert</button>
        <div class="freq-note" id="directionLabel"></div>
        <div class="slider-row"><span class="slider-label">Bands</span><input type="range" id="bandsSlider" min="8" max="128" value="48"><span class="slider-val" id="bandsVal">48</span></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/frequency/main.ts"></script>
</body>
</html>
